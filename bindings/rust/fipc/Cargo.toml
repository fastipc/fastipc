[package]
name = "fipc"
description = "Shared-memory IPC: fast messages and RPC between two processes on one machine (FastIPC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fipc"
readme = "../README.md"
keywords = ["ipc", "shared-memory", "rpc", "interprocess", "gamedev"]
categories = ["os", "network-programming", "concurrency", "game-development"]
include = ["/src/**", "/examples/**", "/LICENSE", "/Cargo.toml"]

[dependencies]
fipc-sys = { version = "1.0.0", path = "../fipc-sys" }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "aarch64-unknown-linux-gnu"]
