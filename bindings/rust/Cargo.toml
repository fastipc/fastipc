[workspace]
members = ["fipc-sys", "fipc"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Hayden Donnelly"]
license = "MIT"
repository = "https://github.com/fastipc/fastipc"
homepage = "https://fastipc.github.io/fastipc/"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
