[package]
name = "fipc-sys"
description = "Raw FFI bindings to FastIPC: shared-memory messages and RPC between two local processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fipc-sys"
readme = "README.md"
keywords = ["ipc", "shared-memory", "ffi", "rpc", "interprocess"]
categories = ["external-ffi-bindings", "os"]
links = "fastipc"
build = "build.rs"
# The published crate carries the prebuilt library for every platform in native/ (put there by
# `devtool package rust`); a checkout of the repository links its zig-out build instead.
include = ["/src/**", "/build.rs", "/native/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "aarch64-unknown-linux-gnu"]
